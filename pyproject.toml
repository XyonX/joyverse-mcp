[project]
name = "joyverse-mcp"
version = "0.1.0"
description = "Personal user data MCP server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    # 1.36 is the first line where put_object accepts both IfMatch and
    # IfNoneMatch, which the conditional writes in joyverse/atomic.py need.
    "boto3>=1.36.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.8.0",
    # PyJWT cannot verify RS256/ES256 tokens without a crypto backend. Any
    # provider that signs with an asymmetric key (Auth0, Google, Clerk, ...)
    # needs this to validate access tokens.
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "httpx>=0.27",
    "openai>=1.0.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcppro", "joyverse"]
py-modules = ["run"]